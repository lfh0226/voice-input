[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "1.0.0"
description = "流式语音输入工具 - 支持讯飞/腾讯/百度云API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "lifuhaolife"}
]
keywords = ["voice", "speech", "input", "streaming", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "websocket-client>=1.6.0",
    "pyperclip>=1.8.2",
    "python-xlib>=0.33",
    "evdev>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[project.scripts]
lb-voice = "voice_input.run:main"
voice-input = "voice_input.run:main"

[project.urls]
Homepage = "https://github.com/lifuhaolife/voice-input"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests with no external side effects",
    "integration: mocked integration tests",
    "live_api: may call real external APIs",
    "audio_device: may access real audio devices",
    "desktop_input: may interact with desktop input or clipboard",
    "manual: requires human interaction",
    "slow: slow tests",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
